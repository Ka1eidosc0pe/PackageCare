name: PackageCare checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Check local CV evidence preparation without model dependencies
        run: python3 -m unittest discover -s tests -p 'test_local_cv.py'
      - run: npm run infra:synth -- --quiet
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the Linux Lambda runtime
        run: docker build --platform linux/amd64 -f infra/Dockerfile.lambda -t packagecare-lambda .
      - name: Verify FFmpeg in the runtime
        run: docker run --rm --entrypoint ffmpeg packagecare-lambda -version
      - name: Exercise Lambda HTTP adaptation and built frontend
        run: docker run --rm -i --entrypoint node packagecare-lambda < scripts/container-smoke.cjs
